<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Golden — connect-src permite SOLO la instancia n8n de GOLDEN - Web API PROD. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://fibotehc.app.n8n.cloud; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Golden</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Allura&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/refresh.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Golden, inicio">
        <span class="brand-mark"><img src="assets/img/logo-claro.png" alt=""></span>
        <span class="brand-name">Golden</span>
      </a>
      <p class="topbar-nav" aria-hidden="true"><span>Panadería</span><span class="dot">·</span><span>Pedidos</span><span class="dot">·</span><span>Gestión</span></p>
      <div class="topbar-user" id="topbar-user" hidden>
        <span class="who">Hola, <strong id="topbar-nombre"></strong><span class="who-panel"> · <span id="topbar-panel"></span></span></span>
        <button type="button" class="btn-dark" id="btn-cambiar-panel" hidden>Cambiar panel</button>
        <button type="button" class="btn-dark" id="btn-salir">Salir</button>
      </div>
    </div>
  </header>
  <main id="app" class="app-main" aria-live="polite"></main>
  <div class="toast-zone" id="toasts" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
